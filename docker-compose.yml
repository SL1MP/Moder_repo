# Базовая конфигурация. Ни одного секрета здесь — только переменные из .env.
# Профили: --profile nexus (свой Nexus), --profile sso (свой Keycloak).
# Если Nexus/Keycloak у заказчика уже есть, контейнеры не поднимаются, а адреса
# берутся из .env (ARTIFACT_BASE_URL, OIDC_ISSUER).

name: moderation

x-proxy-env: &proxy-env
  # Весь исходящий трафик наружу идёт через корпоративный прокси.
  #
  # Когда прокси не настроен, переменные попадают в контейнер ПУСТЫМИ (такова
  # подстановка `${VAR:-}`), и это не безобидно: semgrep-core на пустом
  # HTTP_PROXY падает с «No host was provided in URI», из-за чего SAST не
  # работал вовсе. Пустые значения вычищаются перед запуском внешних сканеров
  # (backend-go/internal/scanners/scanners.go::scannerEnv) — здесь оставлено
  # как есть, потому что список должен остаться словарём: его подмешивают в
  # `environment:` сервисов ключом слияния.
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  # Внутренние адреса обязательно в обход прокси.
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db,nexus,keycloak,api-go,worker-go,web,nginx}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,db,nexus,keycloak,api-go,worker-go,web,nginx}

services:
  nginx:
    # Конфиг зашит в образ (см. nginx/Dockerfile), а не монтируется с хоста:
    # bind-mount с хоста на Docker Desktop + WSL2 ломается с
    # "error mounting ... no such file or directory". Правка конфига:
    # docker compose up -d --build nginx
    build:
      context: ./nginx
    image: moderation-nginx:local
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_TLS_PORT:-8443}:443"
    environment:
      # true — порт 80 редиректит на HTTPS. Локально false: тогда 80 отдаёт
      # приложение и http://localhost:8080 работает как раньше.
      NGINX_FORCE_HTTPS: ${NGINX_FORCE_HTTPS:-false}
      # CN самоподписанного сертификата, если свой не положили в nginx/certs.
      TLS_COMMON_NAME: ${TLS_COMMON_NAME:-localhost}
    volumes:
      # Named volume, а не bind-mount с хоста — с ними этой проблемы нет.
      - web-dist:/usr/share/nginx/html:ro
    depends_on:
      # Весь /api/ обслуживает единственный backend на Go.
      - api-go
      - web

  web:
    build:
      context: ./frontend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: moderation-web:local
    # Сборка SPA складывается в общий volume, откуда её отдаёт nginx.
    volumes:
      - web-dist:/output
    command: ["sh", "-c", "rm -rf /output/* && cp -r /app/dist/* /output/ && echo 'SPA собрана'"]

  # Backend на Go — единственный, который обслуживает API. nginx
  # проксирует в неё весь префикс /api/ (см. nginx/snippets/app.conf).
  #
  # Порт наружу НЕ публикуется: доступ только через nginx. Опубликовать его
  # означало бы отдать API в обход единственного места, где настроены заголовки
  # X-Forwarded-*, по которым сервис видит настоящий адрес клиента.
  #
  # Он же — точка входа для служебных команд (schema, bootstrap,
  # import-packages, migrate --baseline). Образ общий с api-go, но api-go
  # объявлен зависящим от УСПЕШНОГО завершения миграций: пока они падают, он
  # не запускается, и `docker compose run --rm api-go schema` не выполняется
  # вовсе — команда для разбора оказывается заблокирована тем, что она
  # разбирает. У migrate-go такой зависимости нет, только база.
  #
  # Миграции go-набора. Отдельный одноразовый сервис, а не автоматический
  # мигратор внутри api-go: два процесса, накатывающих схему при старте,
  # соревнуются друг с другом, и проигравший падает на полуприменённой
  # миграции. Здесь порядок явный — `docker compose up migrate-go` доходит до
  # конца и завершается.
  #
  # Именно отсутствие этого сервиса дважды выглядело как «кнопка не работает»:
  # go-набор накатывали руками, забывали, сервис писал в несуществующие
  # столбцы и отвечал 500. Теперь тот же `make migrate-go`, что и остальное.
  #
  # Набор идемпотентен (IF EXISTS / ON CONFLICT DO NOTHING в каждой миграции),
  # поэтому повторный прогон безопасен и на базе, созданной Alembic'ом:
  # ограничения там называются иначе, и каждая миграция снимает оба имени.
  migrate-go:
    build:
      context: ./backend-go
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: moderation-backend-go:local
    command: ["migrate"]
    env_file: [.env]
    # Те же тома, что у api-go. Нужны не миграциям, а служебным командам,
    # которые запускают через этот же сервис: bootstrap читает справочник
    # лицензий из /config, maintenance --osv-sync распаковывает снапшот.
    # Без них bootstrap сообщал, что /config/licenses.yml не найден, — и это
    # выглядело как потерянный файл, а не как несмонтированный том.
    volumes:
      - ./config:/config:ro
      - osv-db:/var/lib/osv-db
    environment:
      <<: *proxy-env
      DATABASE_URL: postgres://${POSTGRES_USER:-moderation}:${POSTGRES_PASSWORD:-moderation}@db:5432/${POSTGRES_DB:-moderation}
    # restart не указан намеренно: это разовая задача, а не служба. `no` —
    # значение по умолчанию, и перезапускать успешно завершившийся мигратор
    # означало бы гонять схему по кругу.
    depends_on:
      db:
        condition: service_healthy

  api-go:
    build:
      context: ./backend-go
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: moderation-backend-go:local
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *proxy-env
      LISTEN_ADDR: ":8000"
      # В .env CA_CERTS может быть путём хоста для локального go run. В
      # контейнере всегда используется точка монтирования ниже.
      CA_CERTS: /etc/moderation/ca
      # Go-конфигу нужен готовый DSN. Значение из environment перекрывает env_file.
      DATABASE_URL: postgres://${POSTGRES_USER:-moderation}:${POSTGRES_PASSWORD:-moderation}@db:5432/${POSTGRES_DB:-moderation}
    # Правила YARA и справочники монтируются только для чтения.
    volumes:
      - ./config:/config:ro
      - ${CA_CERTS_HOST:-./certs/ca}:/etc/moderation/ca:ro
      # Снапшот базы OSV нужен и здесь: в процессе api-go живёт сторож
      # очереди, и когда выделенный воркер не забрал пакет, конвейер (вместе с
      # шагом уязвимостей) выполняется прямо тут. Без этого тома тот же пакет
      # у воркера проверялся бы по базе, а у сторожа — с пометкой «снапшот ни
      # разу не загружался».
      - osv-db:/var/lib/osv-db
    depends_on:
      db:
        condition: service_healthy
      # Схема накатывается до старта сервиса. Без этого api-go поднимается на
      # неполной схеме и отвечает 500 на первой же кнопке — ровно так и
      # выглядели оба разбора «кнопка не работает».
      migrate-go:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Воркер конвейера на Go. Очередь — строки request_item в статусе `queued`,
  # отдельного брокера нет (см. backend-go/internal/queue).
  #
  # Поднимается по умолчанию, и это обязательно. Заявки создаёт go-версия
  # (nginx ведёт POST /api/v1/requests в api-go), а она ставит пакет в очередь
  # строкой request_item + pg_notify; отдельный брокер очереди не требуется.
  # Пока этот воркер стоял за профилем go-worker, созданный из UI пакет
  # оставался в статусе `queued`, и снаружи это выглядело как «проверка идёт
  # вечно».
  #
  worker-go:
    build:
      context: ./backend-go
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: moderation-backend-go:local
    restart: unless-stopped
    command: ["worker", "--concurrency=${WORKER_CONCURRENCY:-2}"]
    env_file: [.env]
    environment:
      <<: *proxy-env
      DATABASE_URL: postgres://${POSTGRES_USER:-moderation}:${POSTGRES_PASSWORD:-moderation}@db:5432/${POSTGRES_DB:-moderation}
    volumes:
      - ./config:/config:ro
      - osv-db:/var/lib/osv-db
    depends_on:
      db:
        condition: service_healthy
      migrate-go:
        condition: service_completed_successfully

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moderation}
      POSTGRES_USER: ${POSTGRES_USER:-moderation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moderation} -d ${POSTGRES_DB:-moderation}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    # Realm зашит в образ (см. keycloak/Dockerfile), а не монтируется с хоста:
    # bind-mount отдельного файла на Docker Desktop + WSL2 ломается с
    # "error mounting ... no such file or directory". Правка realm:
    # docker compose --profile sso up -d --build keycloak
    build:
      context: ./keycloak
      args:
        # Внешний адрес попадает в realm на сборке: redirectUris и webOrigins
        # клиента moderation-web. Меняли PUBLIC_BASE_URL — пересоберите образ,
        # иначе Keycloak отклонит редирект после логина.
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    image: moderation-keycloak:local
    profiles: ["sso"]
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD обязателен}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    # Каталог /opt/keycloak/data/h2 намеренно НЕ монтируется как named volume: Keycloak
    # в официальном образе работает от непривилегированного пользователя (uid 1000), а
    # Docker при первом монтировании пустого named volume создаёт его от имени root — H2
    # не может писать файл базы и падает с AccessDeniedException ещё до старта HTTP.
    # Поскольку realm и так перезаливается из образа при каждом старте
    # (--import-realm), персистентность H2 для dev-профиля не нужна: каталог остаётся
    # в writable-слое контейнера с правами, уже заданными образом.

  nexus:
    image: ${NEXUS_IMAGE:-sonatype/nexus3:latest}
    profiles: ["nexus"]
    restart: unless-stopped
    environment:
      NEXUS_SECURITY_RANDOMPASSWORD: "false"
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2g"
    volumes:
      - nexus-data:/nexus-data
    # Nexus готов через 1-3 минуты после старта, а контейнер считался Up сразу —
    # bootstrap успевал прийти раньше и падал на создании репозиториев.
    # `make bootstrap` дожидается именно этого healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  pgdata:
  nexus-data:
  osv-db:
  web-dist:
