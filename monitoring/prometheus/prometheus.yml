global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: moderation-api
    metrics_path: /metrics
    static_configs:
      - targets: [api-go:8000]

  - job_name: moderation-worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker-go:9091]

