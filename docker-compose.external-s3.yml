# Внешнее S3-хранилище вместо контейнера рядом.
#
# Нужен, когда хранилище своё — например, сертифицированное объектное
# хранилище компании: поднимать рядом MinIO незачем и нельзя.
#
#   docker compose -f docker-compose.yml -f docker-compose.external-s3.yml up -d
#
# Что задать в .env (адрес и ключи выдаёт владелец хранилища):
#
#   S3_ENDPOINT=https://s3.example.ru
#   S3_BUCKET=moderation-artifacts
#   S3_ACCESS_KEY=...
#   S3_SECRET_KEY=...
#   S3_REGION=ru-central-1        # какой требует хранилище
#   S3_VIRTUAL_HOST=true          # если адресация bucket.endpoint/key
#   NO_PROXY=...,s3.example.ru    # чтобы обращение шло мимо корпоративного прокси
#
# Бакет должен существовать или должно быть право его создать: сервис создаёт
# его при bootstrap, но многие хранилища такое право не дают.
#
# Проверить совместимость ДО запуска стенда (создание бакета, запись, чтение,
# HEAD, список, удаление):
#
#   cd backend-go && MODERATION_TEST_S3_ENDPOINT=$S3_ENDPOINT \
#     MODERATION_TEST_S3_ACCESS_KEY=... MODERATION_TEST_S3_SECRET_KEY=... \
#     MODERATION_TEST_S3_BUCKET=... go test ./internal/storage/ -run TestLiveS3RoundTrip -v
#
# HTTPS с корпоративным удостоверяющим центром: положите его сертификат в
# контейнеры и укажите SSL_CERT_FILE — Go и Python берут корень доверия оттуда.
# Отключать проверку сертификата сервис не умеет намеренно.
services:
  # Контейнер MinIO не поднимается: профиль, которого нет в списке включённых,
  # и есть штатный способ выключить сервис оверлеем.
  minio:
    profiles: ["disabled-external-s3"]
