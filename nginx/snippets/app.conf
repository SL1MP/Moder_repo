# Общее тело сервера: SPA + проксирование /api. Подключается и в HTTP-, и в
# HTTPS-блок, чтобы конфиг не расходился между ними.

client_max_body_size 16m;
charset utf-8;

access_log /var/log/nginx/access.log;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}

# API, документация и метрики.
location /api/ {
    proxy_pass http://moderation_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # GET /api/v1/requests/{id}?wait=true — блокирующий вариант для CI.
    proxy_read_timeout 1810s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}

location = /health {
    proxy_pass http://moderation_api/health;
    access_log off;
}

location = /metrics {
    proxy_pass http://moderation_api/metrics;
    access_log off;
    # В бою закрывается на уровне сети/ingress: метрики только для Prometheus.
}

# SPA: статика с длинным кешем, остальное — index.html (history API).
root /usr/share/nginx/html;
index index.html;

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
