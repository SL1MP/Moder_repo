# Общее тело сервера: SPA + проксирование /api. Подключается и в HTTP-, и в
# HTTPS-блок, чтобы конфиг не расходился между ними.

client_max_body_size 16m;
charset utf-8;

access_log /var/log/nginx/access.log;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}

# API, документация и метрики.
location /api/ {
    proxy_pass http://moderation_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # GET /api/v1/requests/{id}?wait=true — блокирующий вариант для CI.
    proxy_read_timeout 1810s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}

location = /health {
    proxy_pass http://moderation_api/health;
    access_log off;
}

location = /metrics {
    proxy_pass http://moderation_api/metrics;
    access_log off;
    # В бою закрывается на уровне сети/ingress: метрики только для Prometheus.
}

# Отчёты о сканировании отдаёт Go-версия backend'а.
#
# Префикс длиннее, чем /api/, поэтому по правилам nginx выигрывает именно он, а
# остальной /api/ по-прежнему уходит на python-сервис. Конфликта нет: маршрута
# /api/v1/request-items в python-версии не существует.
#
# Адрес через переменную, а не upstream — по той же причине, что у Keycloak
# ниже: nginx резолвит хосты upstream при разборе конфига, и без поднятого
# api-go не стартовал бы вовсе. Здесь: нет api-go — 502 на этом префиксе.
set $api_go_upstream http://api-go:8000;

location /api/v1/request-items/ {
    proxy_pass $api_go_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}

# Доступ: /auth/config, /auth/me и fallback-вход ведёт go-версия.
#
# Обе версии проверяют токены независимо и одинаково — подпись Keycloak по
# JWKS того же realm'а, локальные токены общим LOCAL_AUTH_SECRET, — поэтому
# токен, полученный здесь, принимается и остальными маршрутами, которые пока
# ведёт python-версия. Это и позволяет переносить маршруты по одному, не
# останавливая сервис.
location /api/v1/auth/ {
    proxy_pass $api_go_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_buffering off;
}

# Маршруты, перенесённые на Go. Пути перечислены поимённо, а не префиксом
# /api/v1/packages/ и /api/v1/requests/, и это не перестраховка: под теми же
# префиксами у python-версии остаются маршруты, которых в go-версии ещё нет
# (админка, «Настройка», GitLab). Префикс увёл бы их в go-версию, где их нет,
# и они отвечали бы 404 вместо работы.
#
# Точные совпадения (location =) выигрывают у любых префиксов, регулярное
# выражение проверяется раньше префикса /api/ — поэтому порядок здесь ни на что
# не влияет и ломаться от перестановки блоков нечему.
#
# /api/v1/requests отдан go-версии целиком: она умеет и список (GET), и
# создание (POST, JSON и multipart с файлом зависимостей). Разводить методы в
# nginx не пришлось — оба конца перенесены.
#
# Под /api/v1/requests/{id}/ у python-версии остаются свои ветки, поэтому
# здесь именно точное совпадение, а не префикс.
location = /api/v1/requests        { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/managers        { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/managers/detect { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/packages        { include /etc/nginx/snippets/api-go-proxy.conf; }
# «Найти пакет»: отвечает не «есть в базе», а можно ли ставить.
location = /api/v1/packages/check  { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/licenses        { include /etc/nginx/snippets/api-go-proxy.conf; }
# Предпросмотр дерева зависимостей. Запрос долгий: по узлу — поход в реестр,
# на сотню узлов это секунды. Общего таймаута снипета (120s) хватает с запасом.
location = /api/v1/dependencies/resolve { include /etc/nginx/snippets/api-go-proxy.conf; }
location ~ ^/api/v1/(packages|requests)/[0-9]+$ {
    include /etc/nginx/snippets/api-go-proxy.conf;
}
# Отзыв одобренного пакета: снимает его с публикации и переводит в «отозван»
# ВСЕ заявки с этой версией.
location ~ ^/api/v1/packages/[0-9]+/revoke$ {
    include /etc/nginx/snippets/api-go-proxy.conf;
}

# Очереди ролей, обсуждения и уведомления — перенесены целиком, вместе со
# всеми методами, поэтому здесь путь можно отдавать go-версии без оглядки на
# метод: POST, PATCH и DELETE по этим адресам она тоже умеет.
location = /api/v1/queue/security   { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/queue/legal      { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/queue/counters   { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/notifications    { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/notifications/read { include /etc/nginx/snippets/api-go-proxy.conf; }
location ~ ^/api/v1/requests/[0-9]+/comments$ {
    include /etc/nginx/snippets/api-go-proxy.conf;
}
location ~ ^/api/v1/comments/[0-9]+$ {
    include /etc/nginx/snippets/api-go-proxy.conf;
}

# Решения ролей и перезапуск заявки. Решение возобновляет конвейер через
# очередь (пакет возвращается в `queued` с отметкой шага), поэтому кнопка в
# интерфейсе доводит работу до конца, а не только меняет статус.
#
# Заведение заявления лицензии (POST /items/{id}/license-claim) тоже здесь:
# оно ходит по ссылке пользователя и снимает текст лицензии, и это перенесено
# вместе с остальным (internal/licensesnap).
location ~ ^/api/v1/items/[0-9]+/(quarantine/release|security-decision|license-claim)$ {
    include /etc/nginx/snippets/api-go-proxy.conf;
}
location = /api/v1/license-claims { include /etc/nginx/snippets/api-go-proxy.conf; }
# Экран «Настройка» и журнал аудита. Перенесены целиком: действующие
# настройки, состояние политик и снапшота, кто разбирает очередь, журнал,
# перезагрузка политик, ручной прогон очереди и синхронизация снапшота.
location = /api/v1/settings          { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/settings/policies { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/system/status     { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/admin/reload      { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/admin/audit       { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/admin/queue-sweep { include /etc/nginx/snippets/api-go-proxy.conf; }
location = /api/v1/admin/osv-versions { include /etc/nginx/snippets/api-go-proxy.conf; }
# Синхронизация снапшота выполняется здесь и сейчас, а не ставится в очередь:
# запрос долгий (снапшот — сотни мегабайт), и общего таймаута снипета может не
# хватить.
location = /api/v1/admin/osv-sync {
    include /etc/nginx/snippets/api-go-proxy.conf;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}
location ~ ^/api/v1/license-claims/[0-9]+(/decision)?$ {
    include /etc/nginx/snippets/api-go-proxy.conf;
}
location ~ ^/api/v1/requests/[0-9]+/(retry|cancel)$ {
    include /etc/nginx/snippets/api-go-proxy.conf;
}

# Keycloak на том же origin, что и приложение.
#
# Зачем: SPA ходит к OIDC-издателю напрямую (frontend/src/lib/auth.ts), и без
# проксирования браузер каждого пользователя обязан сам достучаться до
# Keycloak по ОТДЕЛЬНОМУ порту с ОТДЕЛЬНЫМ сертификатом. Это ломается сразу
# несколькими способами: порт закрыт фаерволом; Keycloak не поднял HTTPS без
# сертификата; сертификат самоподписанный — а обращение к .well-known это
# fetch, и на невалидном сертификате он падает МОЛЧА, без кнопки «всё равно
# перейти». Пользователь видит просто неработающий вход.
#
# С проксированием остаётся один порт, один сертификат и один origin, а
# KEYCLOAK_TLS_PORT наружу не нужен вовсе.
#
# resolver + переменная, а не upstream: хост keycloak поднимается профилем
# sso, и если Keycloak внешний (профиль выключен), nginx с обычным upstream
# не стартовал бы вовсе — он резолвит хосты upstream при разборе конфига
# (см. комментарий в nginx/Dockerfile). С переменной имя резолвится на
# запросе: нет Keycloak — 502 на этих путях, а не упавший nginx.
resolver 127.0.0.11 ipv6=off valid=30s;
set $keycloak_upstream http://keycloak:8080;

# /realms/    — OIDC-эндпоинты, включая .well-known (их дёргает SPA)
# /resources/ — статика консоли и страниц логина
# /admin/     — админконсоль Keycloak
# /js/        — keycloak.js
location ~ ^/(realms|resources|admin|js)/ {
    proxy_pass $keycloak_upstream$request_uri;
    proxy_http_version 1.1;

    # KC_PROXY_HEADERS=xforwarded (см. docker-compose.yml): по этим заголовкам
    # Keycloak строит внешние адреса в .well-known и в redirect'ах. Без
    # X-Forwarded-Proto он подставит http, и браузер заблокирует переход
    # с https-страницы.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_read_timeout 60s;
    proxy_buffering off;
}

# SPA: статика с длинным кешем, остальное — index.html (history API).
root /usr/share/nginx/html;
index index.html;

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
