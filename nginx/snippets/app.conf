# Общее тело сервера: SPA + проксирование /api. Подключается и в HTTP-, и в
# HTTPS-блок, чтобы конфиг не расходился между ними.

client_max_body_size 16m;
charset utf-8;

access_log /var/log/nginx/access.log;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
}

# API, здоровье и метрики — всё на go-версии.
#
# Раньше здесь стоял python-сервис, а перенесённые маршруты перечислялись
# поимённо ниже: под общими префиксами оставались python-маршруты, которых в
# go-версии ещё не было, и префикс увёл бы их туда, где они ответили бы 404.
# Теперь на Go перенесено всё, перечислять нечего, и правило снова одно.
#
# Тот же приём с переменной вместо upstream: nginx резолвит хосты upstream при
# разборе конфига, и без поднятого api-go не стартовал бы вовсе. С переменной
# имя резолвится на запросе — нет api-go, и это 502 на /api/, а не упавший
# nginx, за которым не видно и SPA.
set $api_go_upstream http://api-go:8000;

location /api/ {
    include /etc/nginx/snippets/api-go-proxy.conf;
}

location = /health {
    include /etc/nginx/snippets/api-go-proxy.conf;
    access_log off;
}

location = /metrics {
    include /etc/nginx/snippets/api-go-proxy.conf;
    access_log off;
    # В бою закрывается на уровне сети/ingress: метрики только для Prometheus.
}

# Синхронизация снапшота базы уязвимостей — единственный маршрут со своим
# таймаутом: она выполняется здесь и сейчас, а не ставится в очередь, и
# снапшот весит сотни мегабайт. Общих 120 секунд на него не хватает.
location = /api/v1/admin/osv-sync {
    include /etc/nginx/snippets/api-go-proxy.conf;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
}

# Keycloak на том же origin, что и приложение.
#
# Зачем: SPA ходит к OIDC-издателю напрямую (frontend/src/lib/auth.ts), и без
# проксирования браузер каждого пользователя обязан сам достучаться до
# Keycloak по ОТДЕЛЬНОМУ порту с ОТДЕЛЬНЫМ сертификатом. Это ломается сразу
# несколькими способами: порт закрыт фаерволом; Keycloak не поднял HTTPS без
# сертификата; сертификат самоподписанный — а обращение к .well-known это
# fetch, и на невалидном сертификате он падает МОЛЧА, без кнопки «всё равно
# перейти». Пользователь видит просто неработающий вход.
#
# С проксированием остаётся один порт, один сертификат и один origin, а
# KEYCLOAK_TLS_PORT наружу не нужен вовсе.
#
# resolver + переменная, а не upstream: хост keycloak поднимается профилем
# sso, и если Keycloak внешний (профиль выключен), nginx с обычным upstream
# не стартовал бы вовсе — он резолвит хосты upstream при разборе конфига
# (см. комментарий в nginx/Dockerfile). С переменной имя резолвится на
# запросе: нет Keycloak — 502 на этих путях, а не упавший nginx.
resolver 127.0.0.11 ipv6=off valid=30s;
set $keycloak_upstream http://keycloak:8080;

# /realms/    — OIDC-эндпоинты, включая .well-known (их дёргает SPA)
# /resources/ — статика консоли и страниц логина
# /admin/     — админконсоль Keycloak
# /js/        — keycloak.js
location ~ ^/(realms|resources|admin|js)/ {
    proxy_pass $keycloak_upstream$request_uri;
    proxy_http_version 1.1;

    # KC_PROXY_HEADERS=xforwarded (см. docker-compose.yml): по этим заголовкам
    # Keycloak строит внешние адреса в .well-known и в redirect'ах. Без
    # X-Forwarded-Proto он подставит http, и браузер заблокирует переход
    # с https-страницы.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    proxy_read_timeout 60s;
    proxy_buffering off;
}

# SPA: статика с длинным кешем, остальное — index.html (history API).
root /usr/share/nginx/html;
index index.html;

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}
