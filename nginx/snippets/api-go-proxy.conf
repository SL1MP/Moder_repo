# Общие настройки проксирования в go-версию сервиса.
#
# Вынесено в отдельный файл, потому что маршрутов, уезжающих на Go, становится
# много, а расхождение в заголовках между ними — это ошибка, которую замечают
# в последнюю очередь: часть маршрутов начинает видеть чужой адрес клиента или
# терять схему запроса.
#
# Адрес через переменную, а не upstream: nginx резолвит хосты upstream при
# разборе конфига, и без поднятого api-go сервис не стартовал бы вовсе.
# Здесь: нет api-go — 502 на этих маршрутах, остальное работает.
set $api_go_proxy http://api-go:8000;
proxy_pass $api_go_proxy$request_uri;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 120s;
proxy_buffering off;
