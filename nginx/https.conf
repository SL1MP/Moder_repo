# Единая точка входа: SPA + проксирование /api на FastAPI.
#
# Слушаются оба порта: 80 и 443. Тело сервера общее (snippets/app.conf),
# поэтому конфиг не может разойтись между схемами.
#
# Порт 80 по умолчанию отдаёт приложение — так работает локальная разработка
# на http://localhost:8080. Если сервис выставлен наружу под настоящим именем,
# поставьте NGINX_FORCE_HTTPS=true: тогда 80 начнёт редиректить на 443
# (см. docker-entrypoint.d/10-tls.sh).
#
# Сертификат берётся из /etc/nginx/certs. Если его не положили, при старте
# генерируется самоподписанный — HTTPS поднимается всегда, и SPA получает
# secure context, без которого недоступен window.crypto.subtle (PKCE).

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/app.conf;
}
